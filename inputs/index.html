<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Update NFC Card | BrandStack</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #0a0a0a);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 16px;
    }

    .wrapper { width: 100%; max-width: 440px; }

    .brand { text-align: center; margin-bottom: 20px; }

    .brand h1 {
      font-family: "Playfair Display", serif;
      font-size: 26px;
      letter-spacing: 1px;
      margin: 0;
      background: linear-gradient(135deg, #c9a24d, #ffe3a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand span {
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.7;
    }

    .form-card {
      background: linear-gradient(180deg, #181818, #111);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
      border: 1px solid rgba(201,162,77,.15);
    }

    h2 {
      text-align: center;
      font-size: 18px;
      margin-bottom: 18px;
      font-weight: 500;
      opacity: 0.9;
    }

    label {
      font-size: 12px;
      opacity: .75;
      margin-top: 14px;
      display: block;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      outline: none;
      background: #1f1f1f;
      color: #fff;
      font-size: 14px;
    }

    input:focus {
      border-color: #c9a24d;
      box-shadow: 0 0 0 1px rgba(201,162,77,.4);
    }

    button {
      margin-top: 24px;
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #c9a24d, #a17f3a);
      color: #000;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(201,162,77,.35);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(201,162,77,.45);
    }

    .note {
      font-size: 11px;
      opacity: .6;
      margin-top: 14px;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 14px;
      font-size: 11px;
      opacity: .5;
    }
  </style>
</head>

<body>

<div class="wrapper">

  <div class="brand">
    <h1>BrandStack</h1>
    <span>DIGITAL NFC</span>
  </div>

  <form class="form-card" id="nfcForm">
    <h2>Update Your NFC Card</h2>

    <label>Card ID</label>
    <input type="text" name="cardId" required>

    <label>Full Name</label>
    <input type="text" name="name" required>

    <label>Title / Designation</label>
    <input type="text" name="title">

    <label>Company</label>
    <input type="text" name="company">

    <label>Phone</label>
    <input type="tel" name="phone">

    <label>Email</label>
    <input type="email" name="email">

    <!-- ✅ UPDATED: PHOTO UPLOAD -->
    <label>Profile Photo</label>
    <input type="file" name="photo" accept="image/*">

    <label>WhatsApp Number</label>
    <input type="tel" name="whatsapp">

    <label>Instagram Username</label>
    <input type="text" name="instagram">

    <label>Facebook Profile/Page Name</label>
    <input type="text" name="facebook">

    <label>YouTube Channel Handle</label>
    <input type="text" name="youtube">

    <label>Location (Google Maps URL)</label>
    <input type="url" name="location">

    <label>Website</label>
    <input type="url" name="website">

    <button type="submit">Save & Update Card</button>

    <div class="note">Changes reflect instantly on your NFC card</div>
  </form>

  <div class="footer">© BrandStack Digital NFC</div>
</div>

<script>
const API_URL = "https://nfc-develop.data-brandstack.workers.dev/api/update";
const ADMIN_TOKEN = "3f7c1e9a-6c2b-4b5e-9d44-91c2c0a6b9fd";

document.getElementById("nfcForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const form = e.target;
  const formData = new FormData(form);
  const payload = {};

  for (const [key, value] of formData.entries()) {
    if (key !== "photo" && value && value.trim() !== "") {
      payload[key] = value.trim();
    }
  }

  const file = form.photo.files[0];
  if (file) {
    if (file.size > 500 * 1024) {
      alert("Photo must be less than 500KB");
      return;
    }
    payload.photo = await toBase64(file);
  }

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${ADMIN_TOKEN}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error();
    alert("✅ NFC Card Updated Successfully!");
    form.reset();
  } catch {
    alert("❌ Update failed. Please check details.");
  }
});

function toBase64(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}
</script>

</body>
</html>
